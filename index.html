<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#5D2E0C">
  <title>Salentino BPM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/lucide-static@latest/font/lucide.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar (desktop) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg class="logo-icon" width="36" height="36" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand-copper);flex-shrink:0;">
            <path d="M30 5 C50 5,55 25,52 40 C49 52,38 55,30 55 C22 55,11 52,8 40 C5 25,10 5,30 5Z"/>
            <path d="M28 14 C24 26,24 38,28 50" stroke-width="1.8" opacity="0.5"/>
            <path d="M22 38 C22 26,21 18,21 14 M21 14 C18 11,15 13,16 10 M21 14 C20 10,17 8,19 6 M21 14 C24 12,26 10,24 7" stroke-width="1.6"/>
            <path d="M36 34 C36 26,35 20,35 17 M35 17 C32 14,30 16,31 13 M35 17 C34 13,32 11,34 9 M35 17 C38 15,39 13,37 10" stroke-width="1.6"/>
          </svg>
          <div class="logo-text">
            <strong>Co.Salento</strong>
            <small>Coffee Lab BPM</small>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar">OP</div>
          <div>
            <div class="user-name">Operario</div>
            <div class="user-role">Planta de Producción</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <!-- Top bar (mobile) -->
      <header class="topbar" id="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Menú">
          <i class="lucide-menu"></i>
        </button>
        <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
        <button class="notif-btn" id="notif-btn" aria-label="Notificaciones">
          <i class="lucide-bell"></i>
          <span class="notif-badge" id="notif-badge">3</span>
        </button>
      </header>

      <!-- Page Content -->
      <main class="content" id="content"></main>

      <!-- Bottom Nav (mobile) -->
      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal container -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal"></div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register Service Worker for offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    }
    // Initialize Firebase (async, non-blocking)
    initFirebase().then(ready => {
      if (ready) document.body.dataset.firebase = 'connected';
    });
  </script>
</body>
</html>
